name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 -m unittest discover -s skills/engineering/setup-federated-workflow/tests -p 'test_*.py' -v
      - run: python3 bin/sync-skill-references --check
      - run: git diff --check
  skills-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install and verify a copied pack in an isolated project
        env:
          DISABLE_TELEMETRY: '1'
        run: python3 tests/smoke_skills_cli.py
